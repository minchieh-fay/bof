# 币安 API 凭据文件路径。文件第一行填 API Key，第二行填 API Secret。
keyfile: /root/key

# 计算布林下轨的 K 线周期。30m 表示每根 K 线为 30 分钟，也可填写 15m、1h 等。
kline_interval: 30m

# 首次买入的目标名义金额，单位为 USDT。
amount: 100

# 合约杠杆倍数。5 表示 5 倍杠杆，只影响保证金，不放大上面的买入金额。
leverage: 5

# 每增加一次全局买入计数，目标金额增加基础金额的这个比例。
# 基础金额为 100、比例为 0.5 时，计数为 0、1、2 分别对应 100、150、200 USDT。
amount_step: 0.5

# 首次买入要求价格低于布林下轨的幅度。0.3 表示价格必须低于下轨的 70%。
initial_drop: 0.3

# 全局买入计数每增加 1，触发所需的跌幅额外增加这个比例。
# 初始跌幅为 0.3、这里填 0.2 时，计数为 0、1、2 分别要求跌幅超过 30%、50%、70%。
drop_step: 0.2

# 全局买入计数递减的间隔，单位为分钟。每经过一个完整间隔减 1，最低减到 0。
# 成交后重新计时。例如 13:00 成交且之后没有新成交，计数仍大于 0 时会在 14:00、15:00 递减。
decay_minutes: 60

# 币安合约账户的持仓模式。hedge 表示双向持仓，one_way 表示单向持仓。
# 必须与币安账户上的实际设置一致。
position_mode: hedge

# 按最近 7 个已收盘交易日的现货 USDT 成交额从高到低排名，允许买入的交易对比例。
# 0.8 表示排名前 80% 的交易对可触发买入，其余交易对仍订阅行情。
rank_fraction: 0.6
